apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: bkajaykumar026@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
            - name: wms-gateway
              namespace: wms
              kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wms-app-tls
  namespace: wms
spec:
  secretName: wms-app-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - app.datanetwork.online
    - grafana.datanetwork.online
    - prometheus.datanetwork.online
