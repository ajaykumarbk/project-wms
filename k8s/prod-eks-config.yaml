apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: prod-lab-cluster
  region: us-east-1 # Change if your lab provides a specific region
  version: "1.31"

# 1. Enable OIDC for IAM Roles for Service Accounts (IRSA)
# This is mandatory for production-grade security.
iam:
  withOIDC: true

managedNodeGroups:
  - name: standard-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 4
    volumeSize: 20
    # Enable common production IAM policies for the nodes
    iam:
      withAddonPolicies:
        imageBuilder: true
        autoScaler: true
        cloudWatch: true
        albIngress: true # Necessary for Load Balancer Controller
    ssh:
      allow: false # Useful for debugging inside a lab environment

# 2. Add standard production add-ons
addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver # Needed for Persistent Volumes (SBC)
